# Manual fallback — builds/releases run locally with scripts/release.sh (see RELEASING.md).
# Run it from the Actions tab (or `gh workflow run release.yml -f tag=vX.Y.Z -f platforms=all`)
# after the tag exists. It uploads into the (draft) release for that tag. scripts/release.sh
# --windows-gh uses it with platforms=windows when the Windows installer can't be built locally.
name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build, e.g. v0.3.9
        required: true
      platforms:
        description: Platforms to build
        type: choice
        default: all
        options: [all, windows, macos, linux]

jobs:
  matrix:
    runs-on: ubuntu-latest
    outputs:
      include: ${{ steps.pick.outputs.include }}
    steps:
      - id: pick
        env:
          PLATFORMS: ${{ inputs.platforms }}
        run: |
          all='[
            {"key":"macos","name":"macOS (Apple Silicon)","os":"macos-latest","args":"--target aarch64-apple-darwin"},
            {"key":"windows","name":"Windows","os":"windows-latest","args":""},
            {"key":"linux","name":"Linux","os":"ubuntu-24.04","args":""}
          ]'
          echo "include=$(jq -c --arg p "$PLATFORMS" 'map(select($p == "all" or .key == $p))' <<<"$all")" >> "$GITHUB_OUTPUT"

  bundle:
    name: ${{ matrix.name }}
    needs: matrix
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.matrix.outputs.include) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - name: System dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf \
            libasound2-dev libdbus-1-dev libxdo-dev libclang-dev cmake
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      # macOS signing (Developer ID) and notarization only when the APPLE_* secrets exist.
      # An empty APPLE_CERTIFICATE variable also triggers the certificate import (and fails),
      # so the variables are forwarded only when they have a value.
      - name: macOS signing (if configured)
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$APPLE_CERTIFICATE" ]; then
            for v in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
              [ -n "${!v}" ] && echo "$v=${!v}" >> "$GITHUB_ENV"
            done
            echo "macOS signing: enabled"
          else
            echo "macOS signing: no APPLE_* secrets — bundle left unsigned"
          fi
      # Windows: without a code-signing certificate SmartScreen warns on install.
      # OTA updates: tauri-action signs the update packages and uploads latest.json to the release.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          updaterJsonPreferNsis: true
          tagName: ${{ inputs.tag }}
          releaseName: 'Dyktando X ${{ inputs.tag }}'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
