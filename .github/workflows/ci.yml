# Manual fallback — releases are built locally with scripts/release.sh (see RELEASING.md).
# The same checks run locally with scripts/ci.sh (also used by the opt-in .githooks/pre-push hook).
name: CI

on:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
          - name: Windows
            os: windows-latest
          - name: Linux
            os: ubuntu-24.04
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: System dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf \
            libasound2-dev libdbus-1-dev libxdo-dev libclang-dev cmake

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          # Cache is saved only from main — PRs read it but never overwrite it (saving on Windows takes ~6 min).
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Frontend (TypeScript + Vite)
        run: |
          npm ci
          npm run build

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test --lib --locked

      # The debug build reuses what the tests already compiled (same profile). Full LTO
      # (a second, single-threaded compilation pass) happens only in the release workflow.
      - name: Build app (debug, no bundles)
        run: npx tauri build --debug --no-bundle
