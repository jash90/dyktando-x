name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
          - name: Windows
            os: windows-latest
          - name: Linux
            os: ubuntu-24.04
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Zależności systemowe (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf \
            libasound2-dev libdbus-1-dev libxdo-dev libclang-dev cmake

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          # Zapis cache tylko z main — PR-y go czytają, ale nie nadpisują (Windows zapisuje ~6 min).
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Frontend (TypeScript + Vite)
        run: |
          npm ci
          npm run build

      - name: Testy Rust
        working-directory: src-tauri
        run: cargo test --lib --locked

      # Budowa debug korzysta z tego, co już skompilowały testy (ten sam profil). Pełne LTO
      # (drugi, jednowątkowy przebieg kompilacji) jest tylko w workflow wydania.
      - name: Budowa aplikacji (debug, bez paczek)
        run: npx tauri build --debug --no-bundle
