[package]
name = "dyktando-x"
version = "0.3.4"
description = "Polish dictation and meeting recording with local speech models"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "dyktando_x_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-png", "macos-private-api", "tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
transcribe-rs = { version = "0.3.12", features = ["onnx", "vad-silero", "whisper-cpp"] }
# Ta sama wersja co w transcribe-rs (GPU włącza jego feature) — bezpośrednio dla rozpoznania języka.
whisper-rs = "0.16.0"
cpal = "0.18.2"
anyhow = "1.0.104"
log = "0.4.34"
hound = "3.5.1"
rubato = "5.0.1"
tokio = { version = "1.53.2", features = ["full"] }
dirs = "7.0.0"
chrono = { version = "0.4.45", features = ["serde"] }
tauri-plugin-dialog = "2.8.1"
tar = "0.4.46"
flate2 = "1.1.10"
futures-util = "0.3.34"
thiserror = "2.0.21"
regex = "1.13.1"
once_cell = "1.21.4"
enigo = "0.6.1"
arboard = "3.6.1"
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service", "crypto-rust"] }
reqwest = { version = "0.13.5", features = ["json", "stream"] }
handy-keys = "0.3.4"
env_logger = "0.11.11"
tauri-plugin-single-instance = "2.5.2"
rustfft = "6.4.1"
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["std", "ndarray"] }
ndarray = "0.17.2"
symphonia = { version = "0.6.1", features = ["mp3", "aac", "isomp4", "alac", "aiff", "caf"] }
tauri-plugin-autostart = "2.7.0"
symphonia-adapter-libopus = "0.3.0"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
dispatch2 = "0.3"
objc2 = "0.6"
objc2-core-audio = "0.3"
objc2-core-audio-types = "0.3"
objc2-core-foundation = { version = "0.3", features = ["CFDictionary"] }
objc2-foundation = { version = "0.3", features = ["NSArray", "NSDictionary", "NSString", "NSValue", "NSUUID", "NSObject"] }
transcribe-rs = { version = "0.3.12", features = ["whisper-metal"] }

[target.'cfg(target_os = "linux")'.dependencies]
arboard = { version = "3.6.1", features = ["wayland-data-control"] }

[target.'cfg(target_os = "windows")'.dependencies]
uiautomation = "0.25.1"
wasapi = "0.25.0"
winreg = "0.56.0"

# Zależności (ONNX, whisper.cpp, resampler) w trybie dev też optymalizowane — inaczej transkrypcja
# w `tauri dev` i testach trwa wielokrotnie dłużej.
[profile.dev.package."*"]
opt-level = 3
